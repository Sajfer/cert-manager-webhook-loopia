name: test
### Workflow for testing cert-manager-webhook-loopia ###
### Conformance tests need a live Loopia account and are only run locally ###

# Run on push/pull request of Go-files in branch main or manually.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**.go"
      - "**.mod"
      - "**.sum"
  pull_request:
    branches: [main]
    paths:
      - "**.go"
      - "**.mod"
      - "**.sum"
    tags-ignore:
      - "*"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Echo...
      - run: echo "🎉 The job was automatically triggered by a ${{ github.event_name }} event."
      - run: echo "🐧 This job is now running on a ${{ runner.os }} server hosted by GitHub!"
      - run: echo "🔎 The name of your branch is ${{ github.ref }} and your repository is ${{ github.repository }}."

      # Check out code.
      - name: Check out code
        uses: actions/checkout@v5

      # Download a specific version of the Go tool.
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # Get Go dependencies.
      - name: Get dependencies
        run: go mod download

      # Build and vet. The conformance tests need a live Loopia account,
      # so they are behind the "conformance" build tag and only run locally (see readme).
      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet -tags conformance ./...

      - name: Test
        run: go test -v ./...
