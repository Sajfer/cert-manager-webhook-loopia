name: test
# Checks pull requests. The conformance tests need a live Loopia account and
# are only run locally (see readme); pushes to main are checked by release.yml.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet -tags conformance ./...

      - name: Test
        run: go test -v ./...

      - uses: azure/setup-helm@v4

      - name: Lint chart
        run: helm lint charts/cert-manager-webhook-loopia

      - name: Build image
        run: docker build -t cert-manager-webhook-loopia:ci .
